name: Setup Node and dependencies
description: Node 24 plus node_modules restored from cache (npm ci only on a lockfile change)

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: "npm"

    # Restoring node_modules skips the ~1 minute `npm ci` on every job when the lockfile is unchanged.
    - name: Cache node_modules
      id: modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          apps/mobile/node_modules
        key: modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
