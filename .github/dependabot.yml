version: 2
updates:
  - package-ecosystem: "npm" # or yarn, pip, docker, etc.
    directory: "/" # Directory where the package.json or other dependency files are located
    schedule:
      interval: "daily" # Schedule for checking updates (daily, weekly, monthly)
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Must match the installed react-native minor (see the /apps/mobile entry below).
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "daily"
    # Native packages must match the versions Expo Go ships for the current SDK (see
    # `npx expo install --check`); a newer minor/major builds fine but fails on-device.
    # Upgrade these with `npx expo install --fix` as part of an Expo SDK upgrade instead.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-async-storage/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
