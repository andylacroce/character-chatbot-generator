version: 2
updates:
  - package-ecosystem: "npm" # or yarn, pip, docker, etc.
    directory: "/" # Directory where the package.json or other dependency files are located
    schedule:
      interval: "daily" # Schedule for checking updates (daily, weekly, monthly)
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
  # No Expo/React Native ignores: a bump that doesn't match the Expo SDK fails
  # Mobile CI's `deps:check` (`expo install --check`), so auto-merge never lands it.
  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "daily"
