name: Mobile CI — lint, format, type-check & shared-package tests

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Mobile CI
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Lint (fail on warnings)
        working-directory: apps/mobile
        run: npm run lint -- --max-warnings=0

      - name: Lint markdown
        working-directory: apps/mobile
        run: npm run lint:md

      - name: Check formatting
        working-directory: apps/mobile
        run: npm run format:check

      - name: Type check
        working-directory: apps/mobile
        run: npm run type-check

      - name: Test shared package
        working-directory: packages/shared
        run: npm test
