name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.177.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan JavaScript and TypeScript
        run: >-
          semgrep scan
          --metrics=off
          --error
          --config p/javascript
          --config p/typescript
          --config p/react
          --config p/nodejs
          .
